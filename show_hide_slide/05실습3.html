<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      a {
        color: inherit;
        text-decoration: inherit;
      }
      ul {
        list-style: none;
      }
      ul {
        width: 95%;
        margin: 0 auto;
        display: flex;
        gap: 1rem;
        color: #fff;
      }
      li {
        width: calc((100% - 1rem) / 2);
        height: 500px;
        border: 1px solid gray;
        border-radius: 10px;
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
        position: relative;
      }
      .wrap01 {
        background-image: url(img/samsung1.jpg);
      }
      .wrap02 {
        background-image: url(img/samsung2.png);
      }

      li div {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        /* text-align: center; */
      }
      li p {
        margin: 1 rem 0 2rem;
      }
      li a {
        border: 1px solid #fff;
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 200px;
        padding: 1rem;
        border-radius: 1rem;
      }
      a:hover {
        background-color: #fff;
        color: #000;
      }
      li::before {
        content: "";
        width: 100%;
        height: 100%;
        position: absolute;
        left: 0px;
        top: 0px;
        background-color: rgba(0, 0, 0, 0.5);
        border-radius: 1rem;
      }
      .on {
        width: 80%;
      }
    </style>
  </head>
  <body>
    <ul>
      <li class="wrap01">
        <div class="menu01">
          <h2>회사소개</h2>
          <p>
            삼성에피스홀딩스는 효율적인 경영을 통해 바이오의약품 시장을
            선도하겠습니다.
          </p>
          <a herf="#"
            ><span>자세히보기</span><i class="fa-solid fa-arrow-right-long"></i
          ></a>
        </div>
      </li>
      <li class="wrap02">
        <div class="menu02">
          <h2>자회사 소개</h2>
          <p>
            삼성에피스홀딩스는 효율적인 경영을 통해 바이오의약품 시장을
            선도하겠습니다.
          </p>
          <a herf="#"
            ><span>자세히보기</span><i class="fa-solid fa-arrow-right-long"></i
          ></a>
        </div>
      </li>
    </ul>
    <script>
      $("h2").on("click", function () {
        $(this).siblings(".txt").slideToggle(1000);
      });
    </script>
  </body>
</html>
