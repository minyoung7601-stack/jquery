<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>11자리번호 실습2</title>
    <link rel="stylesheet" href="css/11번자리번호style.css" />
    <script src="js/jquery-4.0.0.min.js"></script>
    <script src="js/11자리번호.js"></script>
    <!-- 내가 만든 외부 js 연결 잊지 말기!!! -->
  </head>
  <body>
    <ul class="large">
      <li>
        <img src="img/pic1.jpg" alt="" />
      </li>
      <li>
        <img src="img/pic2.jpg" alt="" />
      </li>
      <li>
        <img src="img/pic3.jpg" alt="" />
      </li>
      <li>
        <img src="img/pic4.jpg" alt="" />
      </li>
    </ul>
    <ul class="small">
      <li class="on">
        <!-- 클래스 on은 현재 활성화된 상태를 나타냄 -->
        <img src="img/pic1.jpg" alt="" />
      </li>
      <li>
        <img src="img/pic2.jpg" alt="" />
      </li>
      <li>
        <img src="img/pic3.jpg" alt="" />
      </li>
      <li>
        <img src="img/pic4.jpg" alt="" />
      </li>
    </ul>
  </body>
</html>

<!-- small li.on**이라는 코드를 왜 썼는지, 
그리고 이게 실무에서 어떤 엄청난 역할을 하는지

결론부터 말하자면, on은 **"현재 주인공이 누구인지 알려주는 이름표"**입니다.

1. on 클래스를 왜 입력했나요? (이유와 의미)
코딩을 할 때 컴퓨터는 바보라서 우리가 "지금 클릭한 거 빨갛게 만들어줘!"라고 말해도, 
**'지금 클릭한 게 뭔지'**를 계속 기억하지 못합니다. 
그래서 우리는 on이라는 **이름표(Class)**를 사용합니다.

상태 표시: "이 썸네일은 지금 활성화(On) 상태야!"라고 표시하는 것입니다.

약속: 개발자들 사이에서 on, active, selected 같은 이름은 "지금 선택된 상태"를 의미하는 
일종의 약속처럼 쓰입니다. 

HTML에 처음에 써준 이유: 페이지가 처음 열렸을 때, 첫 번째 사진이 큰 이미지로 나와 있죠? 
그럼 아래 썸네일 중에서도 첫 번째 녀석이 주인공이라는 걸 미리 표시해두기 위해 
HTML에 직접 class="on"을 써준 것입니다.

2. on은 어떤 기능을 하나요? (CSS와의 연결)
on 클래스 자체에는 아무런 마법이 없습니다. 하지만 CSS와 결합하면 강력한 시각 효과를 냅니다.
일반 li: opacity: 0.5 (흐릿함)
li.on: border: 5px solid red; opacity: 1; (빨간 테두리 + 선명함)
사용자가 클릭할 때마다 자바스크립트가 이 on이라는 이름표를 뗐다 붙였다 해주면, 
사용자는 **"아, 내가 이걸 클릭해서 지금 이게 빨갛게 변했구나!"**라고 느끼게 되는 것이죠.

핵심 요약
li: 그냥 평범한 학생 (흐릿함)
li.on: 반장 이름표를 단 학생 (빨간 테두리 + 주인공)
기능: 자바스크립트로 이 **반장 이름표(on)**를 옮겨주면서, 
누가 지금 선택되었는지 시각적으로 보여주는 기능입니다.

"클래스 on은 현재 상태를 나타내는 이름표다!" 이것만 기억하시면 됩니다.-->
