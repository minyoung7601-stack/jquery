<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>05addremove 실습2</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      ul {
        list-style: none;
      }
      ul {
        display: flex;
        gap: 1rem;
        width: 1200px;
        margin: 50px auto;
      }
      li {
        width: calc((100% - 3rem) / 4);
      }
      div li {
        height: 160px;
        overflow: hidden;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      img {
        width: 100%;
        transition: 1s;
      }
      .on {
        transform: scale(1.2);
      }
    </style>
  </head>
  <body>
    <ul>
      <li>
        <div><img src="img/pic1.jpg" /></div>
        <p>내용</p>
      </li>
      <li>
        <div><img src="img/pic2.jpg" /></div>
        <p>내용</p>
      </li>
      <li>
        <div><img src="img/pic3.jpg" /></div>
        <p>내용</p>
      </li>
      <li>
        <div><img src="img/pic4.jpg" /></div>
        <p>내용</p>
      </li>
    </ul>
    <script>
      $("li").on("click", function () {
        // $(this).children("div").childer("img").addClass("on");

        $("li img").removeClass("on");
        $(this).find("img").addClass("on");
      });
    </script>
  </body>
</html>
