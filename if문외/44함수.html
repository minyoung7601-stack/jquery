<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>함수</title>
  </head>
  <body>
    <script>
      let i = 0;
      function count() {
        i++;
        console.log(i);
      }

      count();
    </script>
  </body>
</html>
<!-- 
함수는 반복적인것을 실행할때 사용함


함수를 만드는 기본형식
function 함수이름(){
실행문
}

함수는 호출을 해야 실행이 됨
호출은 함수이름()

-->
