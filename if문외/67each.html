<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>67each</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <script src="js/jquery-ui.min.js"></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/egjs-jquery-transform/2.0.0/transform.min.js"
      integrity="sha512-vOc3jz0QulHRiyMXfp676lHxeSuzUhfuw//VUX12odAmlUbnKiXH4GQxBRqwKhF3Mkswqr5ILY9MtEM4ZwcS2A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      ul {
        list-style: none;
      }
      ul {
        display: flex;
        justify-content: center;
        gap: 1rem;
        margin-top: 50px;
      }
      ul span {
        font-size: 12px;
        color: red;
        display: block;
      }
    </style>
  </head>
  <body>
    <ul>
      <li><span></span>HOME</li>
      <li><span></span>HOME</li>
      <li><span></span>HOME</li>
      <li><span></span>HOME</li>
    </ul>

    <script>
      $("ul li").each(function (i) {
        $(this)
          .find("span")
          .text(i + 1);
      });
    </script>
  </body>
</html>
<!-- 
제이쿼리 반복문에는 for, each
자바스크립트 반복문에는 for, forof, forEach


.each() : 선택한 요소를 하나씩 반복하면서 실행

$("선택자").each(function(){
    실행문
})

순번이 필요할때
$("선택자").each(function(index){
    실행문
})

-->
