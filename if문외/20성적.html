  <body>
    <script>
      let a = 70;
      let b = 50;
      let avg = (a + b) / 2;
      console.log(avg);
      if (avg >= 80) {
        console.log("참잘했어요");
      } else if (avg >= 60) {
        console.log("보통이에요");
      } else {
        console.log("노력하세요");
      }
    </script>
  </body>
