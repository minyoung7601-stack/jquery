<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>for</title>
  </head>
  <body>
    <script>
      for (let i = 1; i <= 5; i++) {
        console.log(i);
      }
    </script>
  </body>
</html>
<!-- 
반복문
for(초기값; 조건문; 증감){
조건이 만족할때 실행문
}

초기값은 처음 한번만 체크함
초기값이 [조건문]을 만족하면 실행문에서 실행이 됨
그리고 나서 증감을 하고
조건문을 만족하면 다시 실행문에서 실행이 됨
조건문을 만족하지 못하면 반복문이 종료됨

i = 0
i = i + 1 === i++
i = i - 1 === i--
왼쪽에 있는것을 줄여서 오른쪽처럼 쓴다.

홈페이지에서 5개 이미지를 반복해서 나오게할때 이용함.
-->
