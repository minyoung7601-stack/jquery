<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>반응형헤더 에메트사운드</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script src="js/jquery-4.0.0.min.js"></script>
    <script src="js/반응형헤더선생님버전.js"></script>

    <style>
      * {
        margin: 0px;
        padding: 0px;
      }
      ul {
        list-style: none;
      }
      a {
        color: inherit;
        text-decoration: inherit;
      }
      body {
        background-color: #000;
        color: #fff;
        overflow-x: hidden;
      }

      @media (min-width: 1200px) {
        header {
          width: 90%;
          margin: 0px auto;
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding-top: 2rem;
        }
        .main {
          display: flex;
          gap: 5rem;
          align-items: center;
          font-size: 1.5rem;
        }
        .main ul {
          display: flex;
          gap: 5rem;
        }
        .main i {
          font-size: 2rem;
        }
        .main .close {
          display: none;
        }
      }
      @media (max-width: 1200px) {
        header {
          width: 90%;
          margin: 0px auto;
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding-top: 2rem;
        }
        nav {
          /* width: 300px; */
          height: 50%;
          position: absolute;
          right: -500px;
          bottom: 100px;
          font-size: 70px;
        }
        .main i {
          font-size: 2rem;
        }
        .main .close {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>
        <a href="index.html"><img src="img/bgSquare.png" alt="" /></a>
      </h1>
      <div class="main">
        <nav>
          <ul>
            <li><a href="#">ABOUT EMET</a></li>
            <li><a href="#">ARTISTS</a></li>
            <li><a href="#">LABEL</a></li>
            <li><a href="#">NEWS</a></li>
          </ul>
        </nav>
        <div class="bar"><i class="fa-solid fa-bars-staggered"></i></div>
        <div class="close"><i class="fa-solid fa-xmark"></i></div>
      </div>
    </header>
  </body>
</html>
