<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>배경이미지 늘리기</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      * {
        margin: 0px;
        padding: 0px;
      }
      ul {
        list-style: none;
      }
      a {
        color: inherit;
        text-decoration: inherit;
      }
      ul {
        display: flex;
        gap: 1rem;
      }
      li {
        flex: 0 0 450px;
        /* 너비 늘지도 줄지도 않고 450 사용할꺼야 */
        height: 500px;
        position: relative;
        overflow: hidden;
        /* 배경 이미지 공통 설정 */
        background-position: center;
        background-repeat: no-repeat;
        background-size: 100%;
        /* 초기 크기 */
        transition: 0.5s;
      }
      /* 각 아이템별 배경 이미지 설정 */
      .item01 {
        background-image: url(img/kodak1.jpg);
      }
      .item02 {
        background-image: url(img/kodak2.jpg);
      }
      .item03 {
        background-image: url(img/kodak3.jpg);
      }
      .item04 {
        background-image: url(img/kodak4.jpg);
      }
      .item05 {
        background-image: url(img/kodak5.jpg);
      }
      .item06 {
        background-image: url(img/kodak6.jpg);
      }

      li:hover {
        background-size: 110%;
      }
      /* li:hover img {
        transform: scale(1.2);
        } 배경이미지가 아닌 html에서 div로 이미지 넣었을 경우*/

      .text-box {
        width: 100%;
        position: absolute;
        left: 0;
        bottom: 0;
        padding: 2rem 1.5rem;
        color: #fff;
        background-color: rgba(0, 0, 0, 0.7);
        transition: 0.3s;
      }
      .text-box:hover {
        color: #000;
      }
      a {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <ul>
      <li class="item01">
        <div class="text-box">
