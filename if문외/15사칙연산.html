<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>사칙연산</title>
  </head>
  <body>
    <script>
      let num1 = 10;
      let num2 = 3;

      document.write("숫자를 더한 값은" + (num1 + num2) + "<br>");
      document.write("숫자를 뺀 값은" + (num1 - num2) + "<br>");
      document.write("숫자를 곱한 값은" + num1 * num2 + "<br>");
      document.write("숫자를 나눈 값은" + num1 / num2 + "<br>");
      document.write("숫자를 나눈 나머지 값은" + (num1 % num2));
    </script>
  </body>
</html>
<!-- 
더하기 :: +
빼기 :: - 
곱하기 :: *
나눈 몫 :: /
나머지  :: %

우선 순위를 높이려면 괄호()
문자는 "" 또는 ''안에 입력함
1(숫자)
"1"(문자)
'1'(문자)
결합을 할때 문자가 앞에 나오면 뒤에 있는 숫자도 문자를 취급함

1+2+"값"  ==> 3값

"값"+1+2 ==> 값12
결합을 할때 문자가 앞에 나오면 뒤에 있는 숫자도 문자를 취급함
-->
