      * {

        border: 1px solid red;
        margin: 50px auto;
      }
      ul {
        width: 900px;
        display: flex;
      }
      img {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <ul>

        </li>
        <li>

        </li>
        <li>
          <img src="img/pic3.jpg" />
        </li>
      </ul>
    </div>

    <script>
      $("li").on("click", function () {
        let i = $(this).index();
        console.log(i);

        if (i == 2) {
          $("ul").animate({ "margin-left": "0px" });
        } else {
          $("ul").animate({ "margin-left": -300 * (i + 1) + "px" });
        }
      });

      for (let i = 0; i <= 2; i++) {
        $("li")
          .eq(i)
          .on("click", function () {
            // console.log(i);
            if (i == 2) {
              $("ul").animate({ "margin-left": "0px" });
            } else {
              $("ul").animate({ "margin-left": -300 * (i + 1) + "px" });
            }
          });
      }
    </script>
  </body>
