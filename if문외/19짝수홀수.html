    <script>
      let num = prompt("숫자를 입력해주세요");
      console.log(num);
      if (num > 0) {
        console.log("양수");
      } else if (num < 0) {
        console.log("음수");
      } else {
        console.log("0");
      }
    </script>

<!-- 
if(조건이 참){
조건이 만족하면 실행이 되는 실행문}
else{
조건이 만족하지 못했을때 실행이 되는 실행문
} 

변수는 데이터값을 담을 수 있는  저장공간
let (값이 바뀌어도 되는 변수를 선언할때), const (값이 바뀌면 안되는 변수를 선언할때), var(옛날 방식)
-->
