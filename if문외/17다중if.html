<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=
    , initial-scale=1.0"
    />
    <title>다중if</title>
  </head>
  <body>
    <script>
      let num = 80;
      if (num >= 40) {
        console.log("40이상입니다");
      } else if (num >= 60) {
        console.log("60이상입니다");
      } else {
        console.log("40미만입니다");
      }
    </script>
  </body>
</html>
<!-- 
다중 if문 :: if문이 여러번 나옴.
if문이 여러번 나온다는 의미는 조건문이 여러번 나온다는 의미

if(조건 1이 참이면){
조건1이 참일때 실행문
} else if(조건2 이 참이면){
조건2가 참일때 실행문 
}else if {조건3 이 참이면
조건3이 참일때 실행문
}else{
모든 조건을 다 만족하지 못해서 오는 실행}


아래의 if는 다중if 보다 느림
if(조건 1이 참이면){
실행문
} 

if(조건2 이 참이면){
실행문
}

if(조건3 이 참이면){
실행문
}

if(조건4 이 참이면){
실행문
}
-->
