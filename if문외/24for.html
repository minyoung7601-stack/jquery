    <!-- 문제3
     <script>
      let total = 0;
      for (let i = 1; i <= 3; i++) {
        // total = total + i;
        total += i;
      }
      console.log(total);
    </script> -->

    <!-- 
    문제4 
    <script>
      let total = 0;
      for (let i = 1; i <= 20; i++) {
        total += i;
      }
      console.log(total);
    </script> -->

    <script>
      let total = 0;
      for (let i = 1; i <= 20; i++) {
        if (i % 2 == 0) {
          total = total + i;
        }
      }
      console.log(total);
    </script>
  </body>

<!-- 
1) 1부터 5까지의 수 중에서 짝수만 출력
2) 1부터 10까지의 수 중에서 홀수를 출력
    i로 2를 나누면 0이 아니다(!= 아니다)
3) 1부터 3까지의 합계
total이라는 변수값에는 0이 들어가고, 합계에 해당하는 식 만든다.
total = total + i;
은 total이 2번 들어가서
        total += i;
        로 표시
