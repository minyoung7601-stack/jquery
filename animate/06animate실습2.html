<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>코닥의 아이코닉 컬러</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <style>
      * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
      }
      ul {
        list-style: none;
      }
      a {
        color: inherit;
        text-decoration: inherit;
      }
      ul {
        display: flex;
        gap: 1rem;
      }
      li {
        flex: 0 0 450px;
        height: 500px;
        position: relative;
        overflow: hidden;
      }
      a {
        width: 100%;
        height: 100%;
        display: inline-block;
      }
      img {
        width: 100%;
        height: 100%;
        transition: 0.5s;
        object-fit: cover;
      }
      div {
        width: 95%;
        /* margin: 0px auto; */
        position: absolute;
        left: 50%;
        bottom: 0px;
        transform: translate(-50%, 100%);
        background-color: rgba(255, 255, 0, 0.7);
        color: #fff;
        padding: 1rem;
      }
      p {
        margin-top: 1rem;
      }
      li:hover img {
        /* width: 120%; */
        transform: scale(1.2);
      }
      /* li:hover {
        background-size: 110%;
      } 이미지를 배경이미지로 정했을 경우는*/
      li:hover div {
        color: #000;
      }
    </style>
  </head>
  <body>
    <ul>

    <script>
      $("li").on("mouseenter", function () {
        $(this).find("div").animate({ bottom: "30%" }, 300);
