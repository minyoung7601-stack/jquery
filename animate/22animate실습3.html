<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      ul {
        list-style: none;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      .wrap {
        width: 100%;
        background-color: pink;
        text-align: center;
        padding: 50px 0px;
      }
      ul {
        display: flex;
        gap: 20px;
      }
      li {
        width: 200px;
        height: 50px;
        border: 1px solid red;
        border-radius: 35px;

        line-height: 50px;
        position: relative;
        overflow: hidden;
      }
      .bg {
        background-color: orange;
        width: 100%;
        height: 50px;
        position: absolute;
        left: 0;
        top: 100%;
      }

      a {
        width: 100%;
        height: 100%;
        text-align: center;
        display: inline-block;
        position: absolute;
        top: 0px;
        left: 0px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <ul>
        <li>
          <div class="bg"></div>
          <a href="#">압구정점</a>
        </li>
        <li>
          <div class="bg"></div>
          <a href="#">천호점</a>
        </li>
      </ul>
    </div>
    <script>
      $(".wrap ul li").on("mouseenter", function () {
        $(this).find(".bg").stop().animate({ top: "0" }, 500);
      });
      $(".wrap ul li").on("mouseleave", function () {
        $(this).find("bg").stop().animate({ top: "-100%" }, 500);
      });
    </script>
  </body>
</html>
