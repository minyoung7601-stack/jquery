<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <style>
      body {
        background-color: pink;
        text-align: center;
      }

      .btn {
        width: 150px;
        height: 30px;
        margin: 0 auto;
        border: 1px solid #fff;
        border-radius: 25px;
        text-align: center;
        line-height: 30px;
        cursor: pointer;
        transition: background-position 0.2s;
      }
      .btn:hover {
        background-position: 100% 0%; /* 마우스 올렸을 때 변화 */
        background-color: red;
      }
    </style>
  </head>
  <body>
    <p>에스쁘라 x 누하우스 원제홍 원장이 제안하는</p>
    <h2>Glow & Play NEW 컬러!</h2>
    <div class="btn">Show More</div>
  </body>
</html>
