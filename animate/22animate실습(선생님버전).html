<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <style>
      * {
        margin: 0px;
        padding: 0px;
      }
      a {
        color: inherit;
        text-decoration: inherit;
      }
      .wrap {
        background-color: pink;
        text-align: center;
        padding: 50px 0px;
      }
      h2 {
        margin: 30px 0px;
      }
      .show {
        width: 200px;
        height: 70px;
        margin: 0 auto;
        border: 1px solid #fff;
        border-radius: 35px;
        position: relative;
        overflow: hidden;
      }
      .bg {
        width: 100%;
        height: 70px;
        background-color: red;
        position: absolute;
        left: -200px;
        top: 0px;
      }
      .show p {
        width: 100%;
        height: 70px;
        line-height: 70px;
        /* background-color: #ccc; */
        position: absolute;
        left: 0;
        top: 0;
      }
      .show a {
        width: 100%;
        height: 100%;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p>에스쁘라 x 누하우스 원제홍 원장이 제안하는</p>
      <h2>Glow & Play NEW 컬러!</h2>
      <div class="show">
        <div class="bg"></div>
        <p><a href="#">Show More</a></p>
      </div>
    </div>
    <script>
      $(".show").on("mouseenter", function () {
        $(".bg").stop().animate({ left: "0" });
      });
      $(".show").on("mouseleave", function () {
        $(".bg").stop().animate({ left: "-200px" });
      });
    </script>
  </body>
</html>
