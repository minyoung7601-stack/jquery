<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=
    , initial-scale=1.0"
    />
    <title>Document</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <style>
      div {
        background-color: orange;
        width: 100px;
        height: 100px;
        margin: 50px auto;
        /* border: 5px solid black; */
      }
    </style>
  </head>
  <body>
    <div>박스</div>
    <button class="btn1">시작</button>
    <button class="btn2">초기화</button>
    <script>
      $(".btn1").on("click", function () {
        // $("div").animate({ width: "300px" });
        // $("div").animate({ height: "200px" });

        $("div").animate(
          { width: "300px", height: "200px", "border-radius": "10px" },
          1000,
        );
        // $("div").css({ width: "300px" });
      });

      $(".btn2").on("click", function () {
        $("div").animate(
          { width: "100px", height: "100px", "border-radius": "0px" },
          1000,
        );
        // 초기화버튼을 클릭하면 다시 원래대로 되어라
      });
    </script>
  </body>
</html>
<!-- 
animate는 css + transition을 합친것임
animate는 속성값이 숫자인 경우만 사용가능
font-size:10px; left:50px; 등 숫자가 오는것 가능하나, 
color:red / background-color:#ccc, transform에 해당하는것은 안됨

$("선택자").animate({"속성":"속성값"}, 
밀리초, 콜백함수) 밀리초, 콜백함수는 생략가능.  필요할때 사용하면 됨
-->
