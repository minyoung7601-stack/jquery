<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>35 setInterval 실습</title>
    <script src="js/jquery-4.0.0.min.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
      }
      ul {
        list-style: none;
      }
      .wrap {
        display: flex;
        background-color: #ccc;
        margin-top: 300px;
        height: 50px;
        line-height: 50px;
      }
      .wrap > li {
        width: calc(100% / 3);
        text-align: center;
        overflow: hidden;
      }
      .notice {
        background-color: orange;
      }
    </style>
  </head>
  <body>
    <ul class="wrap">
      <li>공지사항</li>
      <li>
        <ul class="notice">
          <li>공지내용1</li>
          <li>공지내용2</li>
          <li>공지내용3</li>
        </ul>
      </li>
      <li>더보기</li>
    </ul>
    <script>
      setInterval(function () {
        $(".notice")
        .stop()
        .animate({"margin-top":"-50px"}, function () {
            $(".notice li:first-child").appendTo(".notice");
            $(".notice").css({"margin-top":"0"})
      });
        }, 2000);
        
    </script>
  </body>
</html>
<!-- 
1. 자동반복이니 setInterval 
2. notice 위로 높이만큼인 50px 만큼 올림
3. 올리고 나서 앞에 있는 li를 notice 뒤로 보냄

2초마다 
->
