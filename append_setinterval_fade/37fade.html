<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fade</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      ul {
        list-style: none;
      }
      ul {
        width: 600px;
        height: 400px;
        margin: 50px auto;
        border: 1px solid red;
        position: relative;
      }
      li {
        width: 100%;
        height: 100%;
        background-repeat: no-repeat;
        background-position: center;
        background-size: cover;
        position: absolute;
        left: 0;
        top: 0;
        display: none;
      }
      .bg1 {
        background-image: url(img/pic1.jpg);
        display: block;
      }
      .bg2 {
        background-image: url(img/pic2.jpg);
      }
      .bg3 {
        background-image: url(img/pic3.jpg);
      }
      .bg4 {
        background-image: url(img/pic4.jpg);
      }
    </style>
  </head>
  <body>
    <ul>
      <li class="bg1">list1</li>
      <li class="bg2">list2</li>
      <li class="bg3">list3</li>
      <li class="bg4">list4</li>
    </ul>
    <script>
      let i = 0;
      setInterval(function () {
        if (i == 3) {
          i = 0;
        } else {
          i++;
        }

        $("li").fadeOut();
        $("li").eq(i).fadeIn();
      }, 2000);
    </script>
  </body>
</html>
<!-- 2초마다 0,1,2,3 순으로 무한 반복. 이미지가 4장이니까. 
 제이쿼리에서 순번 : eq()
다 안보이게 fadeOut 시키고, eq(0)을 보이고 
-->
