<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fade</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      ul {
        list-style: none;
      }
      ul {
        width: 600px;
        height: 400px;
        margin: 50px auto;
        border: 1px solid red;
        position: relative;
      }
      li {
        width: 100%;
        height: 100%;
        background-repeat: no-repeat;
        background-position: center;
        background-size: cover;
        position: absolute;
        left: 0;
        top: 0;
        display: none;
      }
      .bg1 {
        background-image: url(img/pic1.jpg);
        display: block;
      }
      .bg2 {
        background-image: url(img/pic2.jpg);
      }
      .bg3 {
        background-image: url(img/pic3.jpg);
      }
      .bg4 {
        background-image: url(img/pic4.jpg);
      }
      p {
        font-size: 30px;
        color: red;
        position: absolute;
        left: 50%;
        top: 70%;
        transform: translate(-50%, -50%);
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <ul>
      <li class="bg1"><p>list1</p></li>
      <li class="bg2"><p>list2</p></li>
      <li class="bg3"><p>list3</p></li>
      <li class="bg4"><p>list4</p></li>
    </ul>
    <script>
      let i = 0;
      setInterval(function () {
        $("p").css({ top: "70%", opacity: "0" });

        if (i == 3) {
          i = 0;
        } else {
          i++;
        }
        $("li").fadeOut();
        $("li").eq(i).fadeIn();

        $("li").eq(i).find("p").animate({ top: "50%", opacity: "1" }, 1500);
      }, 2000);
    </script>
  </body>
</html>
