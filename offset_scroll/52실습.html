<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>51실습</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      스크롤을 테스트하기 위해 높이를 줍니다 */ ul {
        list-style: none;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      body {
        height: 3000px;
      }
      header {
        position: fixed; /* 헤더를 상단에 고정 /
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      background: #fff;
      transition: 0.3s; / 부드러운 변화를 위해 추가 */
      }
      .logo_s {
        display: none;
      } /* 작은 로고는 일단 숨김 */
      ul {
        display: flex;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">
        <h1 class="logo_l">
          <a href="index.html"><img src="img/drawing5.png" alt="" /></a>
        </h1>
        <h1 class="logo_s">
          <a href="index.html"><img src="img/bgSquare.png" alt="" /></a>
        </h1>
      </div>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">PRODUCTS</a></li>
        <li><a href="#">ABOUT</a></li>
        <li><a href="#">CONTACT</a></li>
      </ul>
    </header>
    <script>
      $(function () {
        $(window).on("scroll", function () {
          // 1. 현재 스크롤 위치를 숫자로 파악합니다.
          let pos = $(this).scrollTop();
          // 2. 조건문(if)을 통해 상황을 나눕니다.
          if (pos >= 100) {
            // 스크롤이 100px 이상 내려갔을 때 (작은 로고 등장)
            $(".logo_l").hide(); // 큰 로고 숨기기
            $(".logo_s").show(); // 작은 로고 보이기
            $("header").css("padding", "10px 20px"); // 헤더 높이도 줄여주면 더 전문가 같아요!
          } else {
            // 다시 맨 위로 올라왔을 때 (큰 로고 복구)
            $(".logo_l").show();
            $(".logo_s").hide();
            $("header").css("padding", "20px");
          }
        });
      });
    </script>
  </body>
</html>
