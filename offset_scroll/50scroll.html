<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>scroll</title>
    <script src="js/jquery-4.0.0.min.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body {
        height: 3000px;
      }

      div {
        width: 100px;
        height: 100px;
        background-color: orange;
        position: absolute;
        left: 100px;
        top: 500px;
      }
    </style>
  </head>
  <body>
    <div class="box">box</div>
    <script>
      $(window).on("scroll", function () {
        let pos = $(this).scrollTop();
        if (pos >= 300) {
          $("div").stop().animate({ left: "500px" });
        }
      });
    </script>
  </body>
</html>
<!-- 
스크롤 위치에 따라 박스가 실제로 움직이는 애니메이션
-->
