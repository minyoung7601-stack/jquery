<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>56숫자증가</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      .count {
        font-size: 3rem;
        text-align: center;
        margin-top: 50px;
      }
    </style>
  </head>
  <body>
    <div class="count">0</div>
    <script>
      let num = 0;
      let timer = setInterval(function () {
        num += 1;
        $(".count").text(num);
        if (num >= 100) {
          clearInterval(timer);
        }
      }, 20);
    </script>
  </body>
</html>
