<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=
    , initial-scale=1.0"
    />
    <title>숫자증가실습</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      .count,
      .count2 {
        font-size: 3rem;
        text-align: center;
        margin-top: 50px;
      }
    </style>
  </head>
  <body>
    <div class="count">0</div>
    <div class="count2">0</div>
    <script>
      $(function () {
        let num2 = 0;
        let timer2 = setInterval(function () {
          num2 += 1;
          $(".count2").text(num2);
          if (num2 >= 150) {
            clearInterval(timer2);
          }
        });
      });
    </script>
  </body>
</html>
