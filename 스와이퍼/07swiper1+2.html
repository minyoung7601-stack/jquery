<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>07swiper1+2</title>
    <link rel="stylesheet" href="css/07swiper1+2style.css" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1"
    />
    <!-- Link Swiper's CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
    />
  </head>

  <body>
    <!-- Swiper -->
    <div id="visual">
      <div class="swiper mySwiper">
        <div class="swiper-wrapper">
          <div class="swiper-slide"><img src="img/kodak1.jpg" /></div>
          <div class="swiper-slide"><img src="img/kodak2.jpg" /></div>
          <div class="swiper-slide"><img src="img/kodak3.jpg" /></div>
          <div class="swiper-slide"><img src="img/kodak4.jpg" /></div>
        </div>
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
        <div class="swiper-pagination"></div>
      </div>
    </div>
    <div id="container">
      <section id="con01">
        <h2>우리들의 이야기</h2>
        <div class="swiper mySwiper">
          <div class="swiper-wrapper">
            <div class="swiper-slide bg1">Slide 1</div>
            <div class="swiper-slide bg2">Slide 2</div>
            <div class="swiper-slide bg3">Slide 3</div>
            <div class="swiper-slide bg1">Slide 1</div>
            <div class="swiper-slide bg2">Slide 2</div>
            <div class="swiper-slide bg3">Slide 3</div>
          </div>
        </div>
        <div class="swiper-pagination"></div>
      </section>
    </div>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>

    <!-- Initialize Swiper -->
    <script>
      var swiper = new Swiper("#visual .mySwiper", {
        slidesPerView: 1,
        spaceBetween: 30,
        loop: true,
        pagination: {
          el: ".swiper-pagination",
          clickable: true,
        },
        navigation: {
          nextEl: ".swiper-button-next",
          prevEl: ".swiper-button-prev",
        },
      });

      var swiper = new Swiper("#container .mySwiper", {
        slidesPerView: 1,
        spaceBetween: 10,
        pagination: {
          el: ".swiper-pagination",
          clickable: true,
        },
        breakpoints: {
          640: {
            slidesPerView: 2,
            spaceBetween: 20,
          },
          768: {
            slidesPerView: 4,
            spaceBetween: 40,
          },
          1024: {
            slidesPerView: 4.5,
            spaceBetween: 50,
          },
        },
      });
    </script>
  </body>
</html>
