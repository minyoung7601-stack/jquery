<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- Swiper 기본 스타일 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
    />
    <!-- 커스텀 스타일 -->
    <link rel="stylesheet" href="css/swiper실습style.css" />
    <script src="js/jquery-4.0.0.min.js"></script>
  </head>
  <body>
    <!-- 메인 비주얼 영역 -->
    <section id="visual">
      <div class="swiper mySwiper">
        <div class="swiper-wrapper">
          <div class="swiper-slide">
            <img src="img/pic1.jpg" alt="메인1" />
          </div>
          <div class="swiper-slide">
            <img src="img/pic2.jpg" alt="메인2" />
          </div>
          <div class="swiper-slide">
            <img src="img/pic3.jpg" alt="메인3" />
          </div>
          <div class="swiper-slide">
            <img src="img/pic4.jpg" alt="메인4" />
          </div>
        </div>
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
        <div class="swiper-pagination"></div>
        <!-- Autoplay progress UI -->
        <div class="autoplay-progress">
          <svg viewBox="0 0 48 48">
            <circle cx="24" cy="24" r="20"></circle>
          </svg>
          <span></span>
        </div>
      </div>
    </section>

    <!-- 카드형 리스트 영역 -->
    <section id="container">
      <h2>우리들의 이야기</h2>
      <div class="swiper mySwiper">
        <div class="swiper-wrapper">
          <div class="swiper-slide">
            <img src="img/pic1.jpg" alt="메인1" />
          </div>
          <div class="swiper-slide">
            <img src="img/pic2.jpg" alt="메인2" />
          </div>
          <div class="swiper-slide">
            <img src="img/pic3.jpg" alt="메인3" />
          </div>
          <div class="swiper-slide">
            <img src="img/pic4.jpg" alt="메인4" />
          </div>
          <div class="swiper-slide">
            <img src="img/pic1.jpg" alt="메인1" />
          </div>
          <div class="swiper-slide">
            <img src="img/pic2.jpg" alt="메인2" />
          </div>
          <div class="swiper-slide">
            <img src="img/pic3.jpg" alt="메인3" />
          </div>
          <div class="swiper-slide">
            <img src="img/pic4.jpg" alt="메인4" />
          </div>
        </div>
        <div class="swiper-pagination"></div>
      </div>
    </section>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>

    <!-- Initialize Swiper -->
    <script>
      const progressCircle = document.querySelector(".autoplay-progress svg");
      const progressContent = document.querySelector(".autoplay-progress span");

      // #visual 영역 안의 .mySwiper
      var visualSwiper = new Swiper("#visual .mySwiper", {
        slidesPerView: 1,
        spaceBetween: 30,
        loop: true,
        centeredSlides: true,
        autoplay: {
          delay: 2500,
          disableOnInteraction: false,
        },
        pagination: {
          el: "#visual .swiper-pagination",
          clickable: true,
        },
        navigation: {
          nextEl: "#visual .swiper-button-next",
          prevEl: "#visual .swiper-button-prev",
        },
        on: {
          autoplayTimeLeft(s, time, progress) {
            progressCircle.style.setProperty("--progress", 1 - progress);
            progressContent.textContent = `${Math.ceil(time / 1000)}s`;
          },
        },
      });

      // #container 영역 안의 .mySwiper
      var listSwiper = new Swiper("#container .mySwiper", {
        slidesPerView: 1,
        spaceBetween: 10,
        pagination: {
          el: "#container .swiper-pagination",
          clickable: true,
        },
        breakpoints: {
          640: {
            slidesPerView: 2,
            spaceBetween: 20,
          },
          768: {
            slidesPerView: 4,
            spaceBetween: 40,
          },
          1024: {
            slidesPerView: 4.5,
            spaceBetween: 50,
          },
        },
      });
    </script>
  </body>
</html>
