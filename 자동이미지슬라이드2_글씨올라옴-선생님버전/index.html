<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script src="js/jquery-4.0.0.min.js"></script>
    <script src="js/custom.js"></script>
    <style>
      * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
      }
      ul {
        list-style: none;
      }
      /*slider*/
      #slider {
        width: 100%;
        margin: 50px auto;
        /* border: 1px solid red; */
        position: relative;
        overflow: hidden;
      }

      /*panel*/
      .panel {
        width: 100%;
        display: flex;
      }
      .panel li {
        width: 100%;
        height: 300px;

        background-repeat: no-repeat;
        background-size: cover;
        background-position: center;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-shrink: 0;
      }
      .panel li.bg1 {
        background-image: url(img/pic1.jpg);
      }
      .panel li.bg2 {
        background-image: url(img/pic2.jpg);
      }
      .panel li.bg3 {
        background-image: url(img/pic3.jpg);
      }
      .panel li.bg4 {
        background-image: url(img/pic4.jpg);
      }
      .panel li p {
        font-size: 50px;
        color: #fff;
        transform: translateY(100px);
        opacity: 0;
        transition: 1s;
      }

      .panel p.on {
        transform: translateY(0px);
        opacity: 1;
      }
      /*navi*/
      .navi li {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        color: #fff;
      }
      .navi .prev {
        left: 1rem;
      }
      .navi .next {
        right: 1rem;
      }
    </style>
  </head>
  <body>
    <div id="slider">
      <ul class="panel">
        <li class="bg1"><p>PANEL01</p></li>
        <li class="bg2"><p>PANEL02</p></li>
        <li class="bg3"><p>PANEL03</p></li>
        <li class="bg4"><p>PANEL04</p></li>
      </ul>
      <ul class="navi">
        <li class="prev"><i class="fa-solid fa-circle-chevron-left"></i></li>
        <li class="next"><i class="fa-solid fa-circle-chevron-right"></i></li>
      </ul>
    </div>
  </body>
</html>
