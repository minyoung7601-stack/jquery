<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>목업</title>
    <script src="js/jquery-3.7.1.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      section {
        height: 100vh;
      }
      .box {
        width: 90%;
        max-width: 800px;
        border: 1px solid red;
        margin: 0px auto;
        position: relative;
        overflow: hidden; /* 목업 프레임 밖으로 이미지가 나가지 않도록 설정 */
      }
      .box img {
        width: 100%;
      }
      .box .folio {
        width: 100%;
        height: 60%;
        background: url(aa.png) no-repeat center top / cover;
        position: absolute;
        left: 5%;
        top: 10%;
        transition: 10s;
      }
      .box .folio.active {
        background-position: center bottom;
      }
    </style>
  </head>
  <body>
    <section>스크롤 하세요</section>
    <section class="con02">
      <div class="box">
        <img src="screen.png" alt="" />
        <div class="folio"></div>
      </div>
    </section>
    <script>
      $(window).on("scroll", function () {
        //스크롤값
        let scrollTop = $(window).scrollTop();
        console.log(scrollTop);

        //con02의 위치값
        let con02Top = $(".con02").offset().top;
        console.log(con02Top);

        // 스크롤 조건문
        base = 300;
        if (scrollTop >= con02Top + base) {
          $(".box .folio").addClass("active");
        } else {
          $(".box .folio").removeClass("active");
        }
      });
    </script>
  </body>
</html>
<!-- 스크롤한 값이 con02위치보다 크면 folio에 active를 추가하고 그렇지 않으면 active를 삭제함 -->
