<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=
    , initial-scale=1.0"
    />
    <title>흐르는 글자</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      .scroll {
        width: 100%;
        overflow: hidden;
        transform: rotate(-2deg);
      }
      .text {
        display: flex;
        width: 2000px; /*p크기 * p개수*/
        background-color: #ccc;
        position: relative;
        animation: move 3s infinite linear;
      }
      @keyframes move {
        0% {
          left: 0px;
        }
        100% {
          left: -200px; /*p크기*/
        }
      }
      .text p {
        width: 200px;
        font-size: 2.5rem;
      }
    </style>
  </head>
  <body>
    <div class="scroll">
      <div class="text">
        <p>HELLO</p>
        <p>HELLO</p>
        <p>HELLO</p>
        <p>HELLO</p>
        <p>HELLO</p>
        <p>HELLO</p>
        <p>HELLO</p>
        <p>HELLO</p>
        <p>HELLO</p>
        <p>HELLO</p>
        <p>HELLO</p>
        <p>HELLO</p>
      </div>
    </div>
    <div class="scroll">
      <div class="text">
        <p>주말한정 10%할인</p>
        <p>주말한정 10%할인</p>
        <p>주말한정 10%할인</p>
        <p>주말한정 10%할인</p>
        <p>주말한정 10%할인</p>
        <p>주말한정 10%할인</p>
        <p>주말한정 10%할인</p>
        <p>주말한정 10%할인</p>
        <p>주말한정 10%할인</p>
        <p>주말한정 10%할인</p>
        <p>주말한정 10%할인</p>
        <p>주말한정 10%할인</p>
      </div>
    </div>
  </body>
</html>
